<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
  <rect width="640" height="260" fill="#f5f8ff"/>
  <!-- Zona control -->
  <rect x="20" y="90" width="120" height="90" rx="8" fill="#243b6b"/>
  <text x="80" y="130" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">ZONA DE</text>
  <text x="80" y="148" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">CONTROL</text>
  <!-- flecha 30cm -->
  <line x1="140" y1="200" x2="240" y2="200" stroke="#B10E1E" stroke-width="3"/>
  <text x="190" y="192" font-family="Arial" font-size="13" fill="#B10E1E" text-anchor="middle" font-weight="bold">30 cm</text>
  <!-- Zona restringida -->
  <rect x="240" y="80" width="120" height="100" rx="6" fill="#B10E1E"/>
  <text x="300" y="120" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ZONA</text>
  <text x="300" y="137" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">RESTRINGIDA</text>
  <text x="300" y="154" font-family="Arial" font-size="11" fill="#FFD24A" text-anchor="middle">20x20 - h5</text>
  <circle cx="300" cy="72" r="9" fill="#2ecc40" stroke="#0a5" stroke-width="2"/>
  <!-- flecha 25cm -->
  <line x1="360" y1="200" x2="470" y2="200" stroke="#B10E1E" stroke-width="3"/>
  <text x="415" y="192" font-family="Arial" font-size="13" fill="#B10E1E" text-anchor="middle" font-weight="bold">25 cm</text>
  <!-- Zona recuperacion -->
  <rect x="470" y="95" width="120" height="85" rx="6" fill="#1E7D3C"/>
  <text x="530" y="130" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ZONA DE</text>
  <text x="530" y="147" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">RECUPERACION</text>
  <text x="530" y="164" font-family="Arial" font-size="11" fill="#FFD24A" text-anchor="middle">15x15</text>
  <text x="320" y="30" font-family="Arial" font-size="18" fill="#0F3D91" text-anchor="middle" font-weight="bold">DISTRIBUCION DE LAS ZONAS</text>
</svg>
