<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#6A1B9A"/>
  <!-- jeringa -->
  <rect x="40" y="70" width="80" height="22" rx="6" fill="#dfefff" stroke="#fff" stroke-width="2"/>
  <!-- manguera -->
  <path d="M150 90 C 180 70, 200 110, 240 90" fill="none" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>
  <!-- palo de paleta -->
  <rect x="45" y="130" width="90" height="14" rx="7" fill="#C9A26B"/>
  <!-- carton -->
  <rect x="160" y="125" width="80" height="55" fill="#b5843f"/>
  <!-- hilo -->
  <circle cx="80" cy="200" r="22" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- gota agua -->
  <path d="M200 200 q 18 24 0 40 q -18 -16 0 -40" fill="#66ccff"/>
  <text x="150" y="270" font-family="Arial" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">MATERIALES</text>
</svg>
